services:
  mysql:
    image: docker.io/library/mysql:8.0
    container_name: moonlight-database
    environment:
      MYSQL_DATABASE: ${MYSQL_NAME}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Server/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1 FROM users LIMIT 1' -h127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  server:
    image: localhost/moonlight-server:latest
    build:
      context: .
      dockerfile: Server/Dockerfile
    container_name: moonlight-server
    stop_grace_period: 2m
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "0.0.0.0:${LOGIN_PORT}:8484"
      - "0.0.0.0:${SERVER_PORT}:8483"
      - "0.0.0.0:8585-8594:8585-8594"
    volumes:
      - ./Server/scripts:/app/Server/scripts:ro
      - ./Server/logs:/app/Server/logs
      - ./Server/wz:/app/Server/wz:ro
      - server_dat:/app/Server/dat

volumes:
  mysql_data:
  server_dat:
